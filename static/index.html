<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>多模态商品助手</title>
<style>
  body { margin:0; font-family:-apple-system,"Segoe UI",sans-serif; background:#f6f4ef; color:#1d1b18; }
  header { padding:16px 24px; background:#1d1b18; color:#fff; }
  header h1 { margin:0; font-size:18px; }
  header span { color:#a39d92; font-size:12px; }
  main { max-width:1000px; margin:24px auto; padding:0 20px; }
  .drop { border:2px dashed #d8d2c6; border-radius:14px; padding:36px; text-align:center; background:#fff; cursor:pointer; }
  .drop.drag { border-color:#ff6700; background:#fff8f2; }
  .drop img { max-width:260px; max-height:200px; border-radius:8px; margin-top:10px; }
  .hint { color:#7a746a; font-size:12px; margin-top:8px; }
  .tag { display:inline-block; padding:2px 10px; border:1px solid #e6e1d8; border-radius:999px; font-size:12px; margin:4px 6px 0 0; background:#fff; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px; }
  .card { background:#fff; border:1px solid #e6e1d8; border-radius:10px; overflow:hidden; }
  .card .ph { height:130px; background:#efece5; display:flex; align-items:center; justify-content:center; color:#b0a99c; font-size:12px; }
  .card .body { padding:10px 12px; }
  .card .name { font-size:13px; font-weight:600; }
  .card .price { color:#ff6700; font-size:18px; margin-top:6px; font-family:Georgia,serif; }
  .card .shop { color:#8a8378; font-size:11px; margin-top:4px; }
  h3 { margin:22px 0 6px; font-size:14px; }
</style>
</head>
<body>
<header><h1>多模态商品助手</h1><span>拍照 / 上传图片 → 识别 → 搜 MallX 商品</span></header>
<main>
  <div class="drop" id="drop">
    <div>点击或拖拽商品图片到这里</div>
    <div class="hint">支持 jpeg / png / webp，≤5MB</div>
    <input type="file" id="file" accept="image/*" hidden />
    <div id="preview"></div>
  </div>
  <div id="analysis"></div>
  <div id="products"></div>

  <h3>以图搜同款（CLIP）</h3>
  <div class="drop" id="vdrop">点击选择查询图，然后搜相似 / 加入索引
    <input type="file" id="vfile" accept="image/*" hidden />
    <div id="vpreview"></div>
  </div>
  <div class="row" style="display:flex;gap:8px;margin-top:10px;align-items:center">
    <input id="vlabel" placeholder="索引标签（可选）" />
    <input id="vpid" placeholder="关联商品 id（可选）" style="width:160px" />
    <button class="tag" style="cursor:pointer" onclick="vindex()">加入索引</button>
    <button class="tag" style="cursor:pointer" onclick="vsearch()">搜相似</button>
  </div>
  <div id="vresults"></div>
</main>
<script>
const drop = document.getElementById('drop');
const input = document.getElementById('file');
const preview = document.getElementById('preview');
drop.onclick = () => input.click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = () => drop.classList.remove('drag');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
input.onchange = () => { if (input.files[0]) upload(input.files[0]); };

async function upload(file) {
  preview.innerHTML = `<img src="${URL.createObjectURL(file)}" />`;
  document.getElementById('analysis').innerHTML = '<p class="hint">识别中…</p>';
  document.getElementById('products').innerHTML = '';
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch('/api/analyze', { method: 'POST', body: fd });
  if (!r.ok) {
    document.getElementById('analysis').innerHTML = '<p class="hint">识别失败：' + r.status + '</p>';
    return;
  }
  const j = await r.json();
  const a = j.analysis;
  document.getElementById('analysis').innerHTML = `
    <h3>识别结果 ${a.mock ? '<span class="tag">mock 模式</span>' : ''}</h3>
    <p>${a.caption}</p>
    <div>${(a.attributes || []).map((x) => `<span class="tag">${x}</span>`).join('')}</div>
    <div class="hint">搜索词：${(a.keywords || []).join(' / ')} · 命中 ${j.productCount} 件</div>`;
  document.getElementById('products').innerHTML = '<h3>相关商品</h3><div class="grid">' +
    (j.products || []).map((p) => `
      <a class="card" style="text-decoration:none;color:inherit" href="http://localhost:5173/product/${p.id}" target="_blank">
        <div class="ph">${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover" />` : '无图'}</div>
        <div class="body">
          <div class="name">${p.name}</div>
          <div class="price">¥${p.price ?? '-'}</div>
          <div class="shop">${p.shopName || ''}</div>
        </div>
      </a>`).join('') + '</div>';
}
const vdrop = document.getElementById('vdrop');
const vfile = document.getElementById('vfile');
const vpreview = document.getElementById('vpreview');
vdrop.onclick = () => vfile.click();
vfile.onchange = () => { if (vfile.files[0]) vpreview.innerHTML = `<img src="${URL.createObjectURL(vfile.files[0])}" />`; };
async function vsearch() {
  if (!vfile.files[0]) return alert('先选图');
  const fd = new FormData(); fd.append('file', vfile.files[0]);
  const r = await fetch('/api/visual/search', { method: 'POST', body: fd });
  const j = await r.json();
  document.getElementById('vresults').innerHTML = '<h3>相似结果</h3><div class="grid">' +
    (j.matches || []).map((m) => `
      <div class="card">
        <div class="ph"><img src="${m.image}" style="width:100%;height:100%;object-fit:cover" /></div>
        <div class="body">
          <div class="name">${m.product ? m.product.name : (m.label || '未关联商品')}</div>
          <div class="price">${m.product && m.product.price != null ? '¥' + m.product.price : ''}</div>
          <div class="shop">相似度 ${(m.score * 100).toFixed(1)}%</div>
        </div>
      </div>`).join('') + '</div>';
}
async function vindex() {
  if (!vfile.files[0]) return alert('先选图');
  const fd = new FormData(); fd.append('file', vfile.files[0]);
  const label = document.getElementById('vlabel').value.trim();
  const pid = document.getElementById('vpid').value.trim();
  const qs = new URLSearchParams();
  if (label) qs.set('label', label);
  if (pid) qs.set('product_id', pid);
  const r = await fetch('/api/visual/index?' + qs.toString(), { method: 'POST', body: fd });
  if (!r.ok) return alert('索引失败：' + r.status);
  const j = await r.json();
  alert('已索引，当前共 ' + j.indexed + ' 张');
}
</script>
</body>
</html>
